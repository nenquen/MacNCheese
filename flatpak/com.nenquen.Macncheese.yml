app-id: com.nenquen.Macncheese
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
  - org.freedesktop.Sdk.Extension.rust-stable
command: macncheese
finish-args:
  - --share=network
  - --share=ipc
  # Default X11/Xwayland and experimental native Wayland; the TUI opens
  # its own window, the terminal fallback needs no display.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # Roblox asks the GPU driver for VRAM through sysfs (host_vram_bytes).
  - --filesystem=/sys/class/drm:ro
modules:
  - name: darling
    buildsystem: simple
    build-commands:
      - sh install-darling.sh debs.zip
    sources:
      - type: file
        url: https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip
        sha256: 27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd
        dest-filename: debs.zip
      - type: file
        path: install-darling.sh

  - name: macncheese
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin:/usr/lib/sdk/rust-stable/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
    build-commands:
      # The shim and the stub frameworks, against Darling's macOS root.
      - MACNCHEESE_BUILD_DIR=/app/lib/macncheese/shim DARLING_SYSROOT=/app/libexec/darling ./build_debug_shim.sh
      - rm -f /app/lib/macncheese/shim/fast_libc.o
      # Darling without root (see flatpak/darling-noroot.c).
      - gcc -shared -fPIC -O2 -o /app/lib/macncheese/darling-noroot.so flatpak/darling-noroot.c -ldl
      - clang -target x86_64-apple-darwin -fuse-ld=lld -isysroot /app/libexec/darling -mmacosx-version-min=11.0
        -dynamiclib -O2 -o /app/lib/macncheese/launchd_pid1.dylib flatpak/launchd_pid1.c
      - install -d /app/share/macncheese
      - cp -r branding shim frameworks build_debug_shim.sh native /app/share/macncheese/
      - mkdir -p .cargo && cp cargo/config .cargo/config.toml && cargo build --release --offline --manifest-path /app/share/macncheese/native/Cargo.toml && install -Dm755 native/target/release/macncheese /app/lib/macncheese/macncheese
      - install -Dm755 flatpak/macncheese.sh /app/bin/macncheese
      - for size in 16 22 24 32 48 64 128 256 512; do install -Dm644 branding/icons/macncheese-$size.png
        /app/share/icons/hicolor/${size}x${size}/apps/com.nenquen.Macncheese.png; done
      # Also as "macncheese", the name the launcher gives its windows (only
      # app-ID icons are exported to the host; this one stays inside).
      - for size in 16 22 24 32 48 64 128 256 512; do install -Dm644 branding/icons/macncheese-$size.png
        /app/share/icons/hicolor/${size}x${size}/apps/macncheese.png; done
      - install -d /app/share/applications
      - sed 's/^Icon=.*/Icon=com.nenquen.Macncheese/' packaging/com.nenquen.Macncheese.desktop
        > /app/share/applications/com.nenquen.Macncheese.desktop
      - sed 's/^Icon=.*/Icon=com.nenquen.Macncheese/' packaging/com.nenquen.Macncheese.URI.desktop
        > /app/share/applications/com.nenquen.Macncheese.URI.desktop
      # The Roblox window's own entry, so docks show its icon.
      - sed 's/^Icon=.*/Icon=com.nenquen.Macncheese/' packaging/macncheese-roblox-window.desktop
        > /app/share/applications/com.nenquen.Macncheese.RobloxWindow.desktop
      - install -Dm644 flatpak/com.nenquen.Macncheese.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .github
          - website
          - vercel.json
          - .vercel
          - .vercelignore
          - RobloxPlayer.app
          - build
          - backups
          - downloads
          - logs
          - work
          - ffmpeg6
          - ffmpeg_compat
          - frameworks_backup
          - .flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
