[workspace]
members = ["web"]
# Plain `cargo build`/`test` cover the launcher and the browser helper.
default-members = [".", "web"]
resolver = "2"

[package]
name = "macncheese"
version = "0.21.0"
edition = "2021"

[[bin]]
name = "macncheese"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
ratatui-wgpu = "0.1"
winit = { version = "0.30", features = ["x11", "wayland"] }
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
libc = "0.2"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
png = "0.17"
