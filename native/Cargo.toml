[package]
name = "macncheese"
version = "0.21.0"
edition = "2021"

[[bin]]
name = "macncheese"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
libc = "0.2"
ureq = { version = "3", features = ["json"] }
zip = "2"
sha2 = "0.10"
png = "0.17"
